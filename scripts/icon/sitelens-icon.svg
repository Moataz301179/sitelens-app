<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a1e"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff8a"/>
      <stop offset="1" stop-color="#b5e458"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8F169" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C8F169" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded app background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="24" y="24" width="976" height="976" rx="202" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>

  <!-- Radar glow -->
  <circle cx="512" cy="512" r="340" fill="url(#glow)"/>

  <!-- Outer radar ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#C8F169" stroke-opacity="0.9" stroke-width="22"/>

  <!-- Middle ring (dashed) -->
  <circle cx="512" cy="512" r="212" fill="none" stroke="#C8F169" stroke-opacity="0.55" stroke-width="16" stroke-dasharray="20 26"/>

  <!-- Inner ring -->
  <circle cx="512" cy="512" r="126" fill="none" stroke="#C8F169" stroke-opacity="0.35" stroke-width="12"/>

  <!-- Radar sweep line (SE quadrant highlight) -->
  <line x1="512" y1="512" x2="712" y2="312" stroke="#C8F169" stroke-opacity="0.9" stroke-width="26" stroke-linecap="round"/>

  <!-- Sweep tick marks -->
  <line x1="512" y1="212" x2="512" y2="252" stroke="#C8F169" stroke-opacity="0.5" stroke-width="14" stroke-linecap="round"/>
  <line x1="812" y1="512" x2="772" y2="512" stroke="#C8F169" stroke-opacity="0.5" stroke-width="14" stroke-linecap="round"/>
  <line x1="512" y1="812" x2="512" y2="772" stroke="#C8F169" stroke-opacity="0.5" stroke-width="14" stroke-linecap="round"/>

  <!-- Crosshair diagonal (the distinctive "Lens" crosshair) -->
  <line x1="330" y1="694" x2="614" y2="410" stroke="#C8F169" stroke-width="34" stroke-linecap="round"/>

  <!-- Center target dot -->
  <circle cx="512" cy="512" r="46" fill="#C8F169"/>

  <!-- Small highlight on dot -->
  <circle cx="500" cy="498" r="12" fill="#ffffff" fill-opacity="0.45"/>
</svg>
